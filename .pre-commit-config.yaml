repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Pytest with coverage
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: mkdocs
        name: Build documentation
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        always_run: true
