[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1"
version = "0.1.0"
description = "Cliente Python para dados históricos da API OpenF1"
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
    "httpx>=0.27,<1",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "mkdocs-material>=9",
    "pre-commit>=4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=f1 --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["f1"]
branch = true

[tool.coverage.report]
show_missing = true
